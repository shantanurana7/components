<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profile card grid — candidate overview with status, messaging and profile actions." />
    <title>Profile Cards — Candidate Overview</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Compiled CSS (generated by sass from scss/main.scss) -->
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!-- ================================================================
         Block: custom-profile-section
         Root container — max 1120px, grid of 12 profile cards
    ================================================================ -->
    <main>
      <section class="custom-profile-section" aria-labelledby="section-heading">

        <!-- Section header -->
        <div class="custom-profile-section__header">
          <h1 id="section-heading">Candidate Profiles</h1>
          <p>Manage and review your shortlisted candidates at a glance.</p>
        </div>

        <!-- Grid wrapper (overflow container) -->
        <div class="custom-profile-section__grid-wrapper">
          <!-- Cards injected here by JS -->
          <div class="custom-profile-section__grid" id="profile-grid" role="list">
          </div>
        </div>

        <!-- Pagination dots — visible on mobile only -->
        <div
          class="custom-profile-section__pagination"
          id="pagination-dots"
          role="group"
          aria-label="Carousel navigation"
        >
          <!-- Dots injected by JS -->
        </div>

      </section>
    </main>

    <!-- Modals injected into body by JS -->

    <!-- Main JS — loaded at end of body -->
    <script src="js/main.js"></script>
  </body>
</html>
